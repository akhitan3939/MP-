<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="sunGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="60%" stop-color="#FF9800"/>
      <stop offset="100%" stop-color="#FFC107"/>
    </linearGradient>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB300"/>
      <stop offset="50%" stop-color="#FF8F00"/>
      <stop offset="100%" stop-color="#FF6F00"/>
    </linearGradient>
    <linearGradient id="navyRing" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A192F"/>
      <stop offset="100%" stop-color="#071224"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Background Circle -->
  <circle cx="250" cy="250" r="240" fill="#FFFFFF" />

  <!-- Outer Gold Ring -->
  <circle cx="250" cy="250" r="236" fill="none" stroke="url(#goldRing)" stroke-width="7" />

  <!-- Main Navy Outer Border -->
  <circle cx="250" cy="250" r="226" fill="none" stroke="#0B1E38" stroke-width="9" />

  <!-- Inner Subtle Ring -->
  <circle cx="250" cy="250" r="214" fill="none" stroke="#FFA000" stroke-width="1.5" />

  <!-- TOP GRAPHIC SECTION -->
  <g transform="translate(0, -10)">
    <!-- Sun Rays Burst -->
    <g stroke="url(#sunGlow)" stroke-width="4" stroke-linecap="round">
      <line x1="250" y1="140" x2="250" y2="70" stroke-width="5" />
      <line x1="225" y1="145" x2="210" y2="80" />
      <line x1="275" y1="145" x2="290" y2="80" />
      <line x1="200" y1="155" x2="175" y2="98" />
      <line x1="300" y1="155" x2="325" y2="98" />
      <line x1="180" y1="170" x2="148" y2="125" />
      <line x1="320" y1="170" x2="352" y2="125" />
      <line x1="168" y1="190" x2="130" y2="155" />
      <line x1="332" y1="190" x2="370" y2="155" />
    </g>

    <!-- Madhya Pradesh Map Silhouette Background (Stylized MP State Outline) -->
    <path d="M 215 95 C 230 85, 260 85, 275 92 C 290 98, 305 92, 320 105 C 330 115, 345 125, 335 140 C 330 148, 320 155, 325 165 C 335 175, 325 185, 310 188 C 290 190, 280 180, 265 185 C 245 190, 230 180, 215 182 C 195 185, 185 170, 175 165 C 165 155, 170 140, 180 130 C 190 120, 185 110, 195 102 Z" 
          fill="#FF9E1B" opacity="0.9" />

    <!-- Rising Sun Semi-Circle -->
    <path d="M 210 160 A 40 40 0 0 1 290 160 Z" fill="#FFF8E1" stroke="#FF8F00" stroke-width="3" />
    <circle cx="250" cy="160" r="28" fill="#FFE082" />

    <!-- Suspension Bridge (Setu) on Right -->
    <g stroke="#0D2A4A" fill="none">
      <!-- Main Bridge Roadway -->
      <path d="M 260 180 Q 360 180 440 190" stroke-width="5" stroke="#0D2A4A" />
      <!-- Bridge Towers/Pillars -->
      <line x1="345" y1="115" x2="345" y2="185" stroke-width="8" stroke-linecap="round" />
      <line x1="410" y1="150" x2="410" y2="195" stroke-width="6" stroke-linecap="round" />
      <line x1="330" y1="165" x2="360" y2="165" stroke-width="4" />
      <!-- Suspension Cables -->
      <path d="M 270 180 Q 345 120 410 155 Q 430 180 445 190" stroke-width="3" />
      <!-- Vertical Stay Cables -->
      <line x1="300" y1="168" x2="300" y2="182" stroke-width="1.5" />
      <line x1="315" y1="155" x2="315" y2="182" stroke-width="1.5" />
      <line x1="330" y1="140" x2="330" y2="183" stroke-width="1.5" />
      <line x1="365" y1="135" x2="365" y2="185" stroke-width="1.5" />
      <line x1="380" y1="145" x2="380" y2="187" stroke-width="1.5" />
      <line x1="395" y1="153" x2="395" y2="189" stroke-width="1.5" />
    </g>

    <!-- Open Book Symbol (Left & Center) -->
    <!-- Book Spine & Pages -->
    <g filter="url(#shadow)">
      <!-- Left Page Layers -->
      <path d="M 246 230 C 180 230, 110 215, 65 240 C 90 205, 170 170, 246 200 Z" fill="#0E2744" />
      <path d="M 246 226 C 185 224, 120 205, 80 230 C 105 198, 175 168, 246 195 Z" fill="#1C4B82" />
      <path d="M 246 220 C 190 215, 130 195, 95 218 C 120 188, 185 162, 246 188 Z" fill="#4B88CC" />
      <path d="M 246 212 C 195 208, 140 185, 110 205 C 135 178, 195 155, 246 180 Z" fill="#E3F2FD" />
      <path d="M 246 205 C 200 200, 150 175, 125 192 C 150 168, 205 148, 246 172 Z" fill="#FFFFFF" />

      <!-- Right Page Layers -->
      <path d="M 254 230 C 320 230, 390 215, 435 240 C 410 205, 330 170, 254 200 Z" fill="#0E2744" />
      <path d="M 254 226 C 315 224, 380 205, 420 230 C 395 198, 325 168, 254 195 Z" fill="#1C4B82" />
      <path d="M 254 220 C 310 215, 370 195, 405 218 C 380 188, 315 162, 254 188 Z" fill="#4B88CC" />
      <path d="M 254 212 C 305 208, 360 185, 390 205 C 365 178, 305 155, 254 180 Z" fill="#E3F2FD" />
      <path d="M 254 205 C 300 200, 350 175, 375 192 C 350 168, 295 148, 254 172 Z" fill="#FFFFFF" />

      <!-- Central Fountain Pen Nib -->
      <path d="M 250 135 L 268 185 L 264 210 L 236 210 L 232 185 Z" fill="#0D2A4A" stroke="#FFFFFF" stroke-width="2" />
      <!-- Nib slit & breather hole -->
      <circle cx="250" cy="175" r="4.5" fill="#FFFFFF" />
      <line x1="250" y1="135" x2="250" y2="170" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
    </g>
  </g>

  <!-- DIVIDER LINE -->
  <g stroke="#E65100" stroke-width="2" stroke-linecap="round">
    <line x1="75" y1="262" x2="160" y2="262" />
    <line x1="340" y1="262" x2="425" y2="262" />
  </g>

  <!-- MAIN TYPOGRAPHY SECTION -->
  <!-- Header: मध्यप्रदेश -->
  <text x="250" y="270" text-anchor="middle" font-family="'Hind', 'Baloo 2', sans-serif" font-weight="900" font-size="28" fill="#0D2A4A" letter-spacing="1.5">मध्यप्रदेश</text>

  <!-- Brand Name: परीक्षा-सेतु -->
  <g font-family="'Baloo 2', 'Hind', sans-serif" font-weight="900" font-size="64">
    <!-- "परीक्षा" in Navy -->
    <text x="210" y="340" text-anchor="end" fill="#0D2A4A" letter-spacing="1">परीक्षा</text>
    <!-- Hyphen in Gold/Navy -->
    <text x="226" y="332" text-anchor="middle" fill="#0D2A4A" font-size="52">-</text>
    <!-- "सेतु" in Vibrant Saffron/Orange -->
    <text x="242" y="340" text-anchor="start" fill="#F4511E" letter-spacing="1">सेतु</text>
  </g>

  <!-- TAGLINE: तैयारी पक्की, सफलता निश्चित -->
  <g transform="translate(0, 368)">
    <line x1="90" y1="-8" x2="135" y2="-8" stroke="#E65100" stroke-width="1.5" />
    <circle cx="145" cy="-8" r="4.5" fill="#F57C00" />
    <text x="250" y="0" text-anchor="middle" font-family="'Hind', sans-serif" font-weight="800" font-size="18" fill="#0D2A4A" letter-spacing="0.5">तैयारी पक्की, सफलता निश्चित</text>
    <circle cx="355" cy="-8" r="4.5" fill="#F57C00" />
    <line x1="365" y1="-8" x2="410" y2="-8" stroke="#E65100" stroke-width="1.5" />
  </g>

  <!-- BOTTOM NAVY BANNER ARC -->
  <g transform="translate(0, 0)">
    <!-- Navy Arc Background -->
    <path d="M 62 380 Q 250 435 438 380 C 420 445, 345 470, 250 470 C 155 470, 80 445, 62 380 Z" fill="url(#navyRing)" />
    
    <!-- Gold accent line under bottom arc -->
    <path d="M 120 460 Q 250 488 380 460" fill="none" stroke="#FFB300" stroke-width="3.5" stroke-linecap="round" />

    <!-- Mortarboard Cap Icon -->
    <g transform="translate(250, 403) scale(0.85)">
      <polygon points="0,-12 20,-2 0,8 -20,-2" fill="#FFFFFF" />
      <path d="M -12,2 L -12,10 C -12,14 12,14 12,10 L 12,2" fill="#FFFFFF" />
      <circle cx="0" cy="-2" r="1.5" fill="#FFB300" />
      <line x1="16" y1="-1" x2="20" y2="10" stroke="#FFB300" stroke-width="1.5" />
      <circle cx="20" cy="11" r="1.5" fill="#FFB300" />
    </g>

    <!-- Slogan / Motto in Navy Arc -->
    <text x="250" y="440" text-anchor="middle" font-family="'Hind', 'Baloo 2', sans-serif" font-weight="900" font-size="16" fill="#FFD54F" letter-spacing="1.2">★ म.प्र. शासन भर्ती परीक्षा सेतु ★</text>
  </g>
</svg>
